<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGAT - Inicio | Padre de Familia</title>
  <link rel="stylesheet" href="estilosp.css" />
</head>
<body>

  <!-- Barra Superior -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">SIGAT</span>
      <span class="brand-badge">Padre de Familia</span>
    </div>

    <nav class="top-nav">
      <a href="interfazpadre.html" class="active">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
        Inicio
      </a>
      <a href="notaspadre.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Notas
      </a>
      <a href="comunicados.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Comunicados
      </a>
    </nav>

    <div class="user-controls">
      <span id="saludo-usuario" class="user-greeting">Hola</span>
      <div id="avatar-usuario" class="avatar-sm">--</div>
      <a href="" id="btn-logout" class="btn-logout">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Salir
      </a>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="container">
    <!-- Banner Estudiante Vinculado -->
    <section class="student-banner">
      <div class="student-info">
        <div id="avatar-estudiante" class="avatar-lg">--</div>
        <div>
          <h1 id="estudiante-nombre">Cargando...</h1>
          <p id="estudiante-detalle">Curso: -- &middot; Doc: --</p>
        </div>
      </div>
      <div id="estudiante-promedio" class="student-avg">--</div>
    </section>

    <!-- Tarjetas de Períodos -->
    <section class="grid-4">
      <div class="card">
        <div class="period-label">Período 1</div>
        <div id="p1-score" class="period-score">--</div>
        <div id="p1-status" class="period-status">--</div>
      </div>
      <div class="card">
        <div class="period-label">Período 2</div>
        <div id="p2-score" class="period-score">--</div>
        <div id="p2-status" class="period-status">--</div>
      </div>
      <div class="card">
        <div class="period-label">Período 3</div>
        <div id="p3-score" class="period-score">--</div>
        <div id="p3-status" class="period-status">--</div>
      </div>
      <div class="card">
        <div class="period-label">Período 4</div>
        <div id="p4-score" class="period-score">--</div>
        <div id="p4-status" class="period-status">--</div>
      </div>
    </section>

    <!-- Accesos Rápidos (Sin Horario) -->
    <section class="grid-3">
      <a href="notaspadre.html" class="card action-card">
        <div class="action-left">
          <div class="icon-box icon-green">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          </div>
          <div>
            <div class="action-title">Ver notas completas</div>
            <div class="action-sub">Detalle por período y materia</div>
          </div>
        </div>
        <span class="chevron">&#8250;</span>
      </a>

      <a href="comunicados.html" class="card action-card">
        <div class="action-left">
          <div class="icon-box icon-amber">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </div>
          <div>
            <div class="action-title">Comunicados</div>
            <div id="resumen-comunicados" class="action-sub">--</div>
          </div>
        </div>
        <span class="chevron">&#8250;</span>
      </a>

      <div class="card action-card">
        <div class="action-left">
          <div class="icon-box icon-green">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <div>
            <div class="action-title">Asistencia</div>
            <div id="resumen-asistencia" class="action-sub">--</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Barra Inferior -->
  <nav class="bottom-nav">
    <a href="interfazpadre.html" class="active">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
      Inicio
    </a>
    <a href="notaspadre.html">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Notas
    </a>
    <a href="comunicados.html">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      Comunicados
    </a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
