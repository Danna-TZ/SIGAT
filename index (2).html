<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIGAT – Iniciar sesión</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <div class="logo-box" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </div>
    <div>
      <strong class="brand">SIGAT</strong>
      <span class="badge" id="roleBadge">ACCESO DOCENTE</span>
    </div>
  </header>

  <main class="main">
    <!-- Vista 1: selección de rol -->
    <section class="view" id="viewRoles">
      <div class="roles-head">
        <h1 class="roles-title">Bienvenido a SIGAT</h1>
        <p class="roles-sub">Selecciona cómo quieres ingresar</p>
      </div>
      <div class="roles-grid" id="rolesGrid"></div>
    </section>

    <!-- Vista 2: login del rol elegido -->
    <section class="view" id="viewLogin" hidden>
    <div class="role-pill" id="rolePill">
      <span class="role-icon" id="pillIcon">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>
      </span>
      <span id="roleText">Acceso Docente</span>
    </div>

    <section class="card">
      <div class="card-icon" id="cardIcon">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>
      </div>
      <h1>Iniciar sesión</h1>
      <p class="subtitle">Ingresa tus credenciales para continuar</p>

      <div class="alert" id="alert" role="alert" hidden></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="documento">Número de documento <span class="req">*</span></label>
          <div class="input-wrap">
            <svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            <input type="text" id="documento" name="documento" placeholder="Ej: 1023456789" inputmode="numeric" autocomplete="username">
          </div>
          <small class="error" id="docError"></small>
        </div>

        <div class="field">
          <label for="password">Contraseña <span class="req">*</span></label>
          <div class="input-wrap">
            <svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input type="password" id="password" name="password" placeholder="Tu contraseña" autocomplete="current-password">
            <button type="button" class="toggle" id="togglePass" aria-label="Mostrar contraseña">
              <svg id="eyeOn" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeOff" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.9 17.9A10 10 0 0 1 12 19c-6 0-10-7-10-7a18 18 0 0 1 4.1-4.9M9.9 5.1A9 9 0 0 1 12 5c6 0 10 7 10 7a18 18 0 0 1-2.2 3.2M1 1l22 22"/></svg>
            </button>
          </div>
          <small class="error" id="passError"></small>
        </div>

        <a href="#" class="forgot" id="forgot">¿Olvidaste tu contraseña?</a>

        <button type="submit" class="btn-primary" id="submitBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
          <span>Iniciar sesión SIGAT</span>
        </button>
      </form>

      <div class="card-footer">
        <a href="#" class="back" id="back">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          Volver
        </a>
      </div>
    </section>

    </section>

    <p class="legal">© 2026 SIGAT — Uso exclusivo de personal autorizado</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
