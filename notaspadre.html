<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGAT - Notas | Padre de Familia</title>
  <link rel="stylesheet" href="estilosp.css" />
</head>
<body>

  <!-- Barra Superior -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">SIGAT</span>
      <span class="brand-badge">Padre de Familia</span>
    </div>

    <nav class="top-nav">
      <a href="interfazpadre.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
        Inicio
      </a>
      <a href="notaspadre.html" class="active">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Notas
      </a>
      <a href="comunicados.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Comunicados
      </a>
    </nav>

    <div class="user-controls">
      <span id="saludo-usuario" class="user-greeting">Hola</span>
      <div id="avatar-usuario" class="avatar-sm">--</div>
      <a href="login.html" id="btn-logout" class="btn-logout">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Salir
      </a>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="container">
    <div class="page-header">
      <div class="page-title-group">
        <a href="interfazpadre.html" class="btn-back">&#8592; Volver</a>
        <h1 id="titulo-notas" class="page-title">Notas</h1>
      </div>
    </div>

    <!-- Resumen Académico -->
    <section class="grid-4">
      <div class="card">
        <div class="period-label">Promedio</div>
        <div id="stat-promedio" class="stat-value">--</div>
      </div>
      <div class="card">
        <div class="period-label">Estado</div>
        <div id="stat-estado" class="stat-value approved">--</div>
      </div>
      <div class="card">
        <div class="period-label">Curso</div>
        <div id="stat-curso" class="stat-value">--</div>
      </div>
      <div class="card">
        <div class="period-label">Período Actual</div>
        <div id="stat-periodo" class="stat-value">--</div>
      </div>
    </section>

    <!-- Tabla de Calificaciones -->
    <section class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Materia</th>
            <th>Período 1</th>
            <th>Período 2</th>
            <th>Período 3</th>
            <th>Período 4</th>
            <th>Promedio</th>
          </tr>
        </thead>
        <tbody id="tabla-notas-body">
          <!-- Se llena dinámicamente desde app.js -->
        </tbody>
      </table>
    </section>
  </main>

  <!-- Barra Inferior -->
  <nav class="bottom-nav">
    <a href="interfazpadre.html">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/></svg>
      Inicio
    </a>
    <a href="notaspadre.html" class="active">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Notas
    </a>
    <a href="comunicados.html">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      Comunicados
    </a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
